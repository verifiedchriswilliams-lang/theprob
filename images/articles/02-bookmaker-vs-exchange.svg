<text x="76" y="126" fill="#aaa39a" font-family="Arial,sans-serif" font-size="19">Simplified structural comparison</text>
<text x="150" y="235" fill="#D8A85C" font-family="Arial,sans-serif" font-size="28" font-weight="700">SPORTSBOOK</text><text x="150" y="300" fill="#efebe3" font-family="Arial,sans-serif" font-size="22" font-weight="400">Bookmaker publishes odds</text><text x="150" y="350" fill="#efebe3" font-family="Arial,sans-serif" font-size="22" font-weight="400">and manages its exposure</text><text x="680" y="235" fill="#D8A85C" font-family="Arial,sans-serif" font-size="28" font-weight="700">PREDICTION MARKET</text><text x="680" y="300" fill="#efebe3" font-family="Arial,sans-serif" font-size="22" font-weight="400">Participants trade contracts</text><text x="680" y="350" fill="#efebe3" font-family="Arial,sans-serif" font-size="22" font-weight="400">and prices update</text><line x1="590" y1="190" x2="590" y2="470" stroke="#6f675d" stroke-width="2"/>
