<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Reading prediction market odds</title><desc id="desc">Illustrative price-to-probability scale</desc>
<rect width="1200" height="675" fill="#121110"/>
<circle cx="1080" cy="95" r="180" fill="#1b1916"/>
<text x="76" y="86" fill="#efebe3" font-family="Arial,sans-serif" font-size="30" font-weight="700">Reading prediction market odds</text>
<text x="76" y="126" fill="#aaa39a" font-family="Arial,sans-serif" font-size="19">Illustrative price-to-probability scale</text>
<text x="90" y="260" fill="#efebe3" font-family="Arial,sans-serif" font-size="32" font-weight="400">5%</text><text x="90" y="300" fill="#aaa39a" font-family="Arial,sans-serif" font-size="20" font-weight="400">$0.05</text><text x="330" y="260" fill="#efebe3" font-family="Arial,sans-serif" font-size="32" font-weight="400">25%</text><text x="330" y="300" fill="#aaa39a" font-family="Arial,sans-serif" font-size="20" font-weight="400">$0.25</text><text x="570" y="260" fill="#efebe3" font-family="Arial,sans-serif" font-size="32" font-weight="400">50%</text><text x="570" y="300" fill="#aaa39a" font-family="Arial,sans-serif" font-size="20" font-weight="400">$0.50</text><text x="810" y="260" fill="#D8A85C" font-family="Arial,sans-serif" font-size="40" font-weight="700">73%</text><text x="810" y="300" fill="#aaa39a" font-family="Arial,sans-serif" font-size="20" font-weight="400">$0.73</text><text x="1050" y="260" fill="#efebe3" font-family="Arial,sans-serif" font-size="32" font-weight="400">95%</text><text x="1050" y="300" fill="#aaa39a" font-family="Arial,sans-serif" font-size="20" font-weight="400">$0.95</text><line x1="90" y1="350" x2="1100" y2="350" stroke="#D8A85C" stroke-width="8"/><text x="90" y="410" fill="#aaa39a" font-family="Arial,sans-serif" font-size="18" font-weight="400">LOWER IMPLIED PROBABILITY</text><text x="820" y="410" fill="#aaa39a" font-family="Arial,sans-serif" font-size="18" font-weight="400">HIGHER IMPLIED PROBABILITY</text>
<text x="76" y="625" fill="#8c857c" font-family="Arial,sans-serif" font-size="16">THE PROB  ·  ILLUSTRATIVE EXAMPLE</text>
</svg>