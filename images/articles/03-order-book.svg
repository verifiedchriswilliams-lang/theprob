<text x="150" y="205" fill="#D8A85C" font-family="Arial,sans-serif" font-size="24" font-weight="700">BIDS</text><text x="720" y="205" fill="#D8A85C" font-family="Arial,sans-serif" font-size="24" font-weight="700">ASKS</text><text x="150" y="275" fill="#efebe3" font-family="Arial,sans-serif" font-size="24" font-weight="400">$0.48  ·  1,000</text><text x="150" y="335" fill="#efebe3" font-family="Arial,sans-serif" font-size="24" font-weight="400">$0.47  ·  2,500</text><text x="150" y="395" fill="#efebe3" font-family="Arial,sans-serif" font-size="24" font-weight="400">$0.46  ·  5,000</text><text x="720" y="275" fill="#efebe3" font-family="Arial,sans-serif" font-size="24" font-weight="400">$0.52  ·  900</text><text x="720" y="335" fill="#efebe3" font-family="Arial,sans-serif" font-size="24" font-weight="400">$0.53  ·  2,000</text><text x="720" y="395" fill="#efebe3" font-family="Arial,sans-serif" font-size="24" font-weight="400">$0.54  ·  4,000</text><line x1="600" y1="220" x2="600" y2="460" stroke="#D8A85C" stroke-width="4"/><text x="480" y="500" fill="#D8A85C" font-family="Arial,sans-serif" font-size="22" font-weight="700">4¢ SPREAD</text>
