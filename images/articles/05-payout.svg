<text x="130" y="240" fill="#D8A85C" font-family="Arial,sans-serif" font-size="30" font-weight="700">YES</text><text x="130" y="310" fill="#efebe3" font-family="Arial,sans-serif" font-size="30" font-weight="400">$100 payout</text><text x="130" y="365" fill="#efebe3" font-family="Arial,sans-serif" font-size="21" font-weight="400">$40 cost · $60 gross profit</text><text x="680" y="240" fill="#D8A85C" font-family="Arial,sans-serif" font-size="30" font-weight="700">NO</text><text x="680" y="310" fill="#efebe3" font-family="Arial,sans-serif" font-size="30" font-weight="400">$0 payout</text><text x="680" y="365" fill="#efebe3" font-family="Arial,sans-serif" font-size="21" font-weight="400">$40 cost · $40 loss</text><line x1="590" y1="190" x2="590" y2="450" stroke="#6f675d" stroke-width="2"/>
