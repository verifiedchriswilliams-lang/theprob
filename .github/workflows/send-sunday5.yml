name: Build and Send Sunday 5 Newsletter

on:
  schedule:
    - cron: '0 12 * * 0'  # 6:00 AM CT (UTC-6) Sundays
  workflow_dispatch:

jobs:
  build-sunday5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build Sunday 5 newsletter
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: python scripts/send_sunday5.py

