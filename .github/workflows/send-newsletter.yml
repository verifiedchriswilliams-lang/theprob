name: Build and Send Daily Newsletter

on:
  schedule:
    - cron: '0 12 * * *'  # 6:00 AM CT (UTC-6) daily through Nov 30 test period
  workflow_dispatch:

jobs:
  build-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build and send newsletter
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: python scripts/send_newsletter.py

      - name: Commit newsletter to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter/
          git diff --staged --quiet || git commit -m "chore: build daily newsletter [skip ci]"
          git pull --rebase origin main
          git push
