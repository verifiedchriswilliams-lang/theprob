name: Build and Send Daily Newsletter

on:
  schedule:
    - cron: '0 12 * * 1-6'  # 6:00 AM CT (UTC-6) Mon-Sat (Sunday sends the Sunday 5)
  workflow_dispatch:

jobs:
  build-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build and send newsletter
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: python scripts/send_newsletter.py

